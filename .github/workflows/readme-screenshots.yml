name: README screenshots

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/capture-web-screenshots.mjs'
      - '.github/workflows/readme-screenshots.yml'

permissions:
  contents: read

jobs:
  web:
    name: Capture web demo screenshots
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install Playwright
        run: |
          npm --prefix /tmp/pw init -y
          npm --prefix /tmp/pw install --no-audit --no-fund playwright@1.56.1
          /tmp/pw/node_modules/.bin/playwright install --with-deps chromium

      # Keep the script next to node_modules so ESM resolution finds playwright.
      - name: Capture
        env:
          SITE_URL: https://rezaxr14.github.io/WhatToCook_mobile_serverless
          OUT_DIR: ${{ github.workspace }}/docs/screenshots/web
        run: |
          mkdir -p "$OUT_DIR"
          cp scripts/capture-web-screenshots.mjs /tmp/pw/
          node /tmp/pw/capture-web-screenshots.mjs

      - uses: actions/upload-artifact@v5
        with:
          name: web-screenshots
          path: docs/screenshots/web
          retention-days: 7
