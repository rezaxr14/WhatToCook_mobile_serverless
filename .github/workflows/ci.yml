name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  pull-requests: read

jobs:
  quality:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Lint
        run: pnpm -r lint

      - name: Test
        run: pnpm -r test

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Deno check (Edge Functions)
        run: |
          deno check --config supabase/functions/deno.json \
            supabase/functions/generate-recipe/index.ts \
            supabase/functions/scan-pantry/index.ts \
            supabase/functions/suggest-substitution/index.ts \
            supabase/functions/tests/test_harness.ts \
            supabase/functions/tests/*_test.ts

      - name: Deno lint (Edge Functions)
        run: deno lint --config supabase/functions/deno.json supabase/functions

      - name: Deno test (Edge Functions)
        run: >-
          deno test --config supabase/functions/deno.json
          --allow-env --allow-net
          supabase/functions/tests

      - name: Build web
        run: pnpm --filter @whattocook/web build

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
