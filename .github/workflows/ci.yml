name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  pull-requests: read

jobs:
  quality:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          run_install: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check GitHub Actions are pinned
        run: node scripts/check-actions-pins.mjs

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Lint
        run: pnpm -r lint

      - name: Test
        run: pnpm -r test

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x

      - name: Deno check (Edge Functions)
        run: |
          deno check --config supabase/functions/deno.json \
            supabase/functions/generate-recipe/index.ts \
            supabase/functions/scan-pantry/index.ts \
            supabase/functions/suggest-substitution/index.ts \
            supabase/functions/cache-ingredient-images/index.ts \
            supabase/functions/recache-images/index.ts \
            supabase/functions/tests/test_harness.ts \
            supabase/functions/tests/*_test.ts

      - name: Deno lint (Edge Functions)
        run: deno lint --config supabase/functions/deno.json supabase/functions

      - name: Deno test (Edge Functions)
        run: >-
          deno test --config supabase/functions/deno.json
          --allow-env --allow-net
          supabase/functions/tests

      - name: Build web
        run: pnpm --filter @whattocook/web build

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
