name: Provider smoke

# Manual, secret-backed checks that the configured cloud AI providers answer
# from a network where they are reachable. Never runs on pull requests: fork
# PRs cannot read repository secrets and a live call costs money.
on:
  workflow_dispatch:

jobs:
  gemini:
    name: Gemini live call
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check the key and list text models
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::GEMINI_API_KEY repository secret is not set"
            exit 1
          fi
          status=$(curl -sS --max-time 30 -o models.json -w "%{http_code}" \
            "https://generativelanguage.googleapis.com/v1beta/models" \
            -H "x-goog-api-key: $GEMINI_API_KEY")
          echo "list_models_http=$status"
          python3 - <<'PY'
          import json
          data = json.load(open('models.json'))
          if isinstance(data, dict) and data.get('error'):
              print('error_status:', data['error'].get('status'))
              print('error_message:', data['error'].get('message'))
              raise SystemExit(1)
          ids = [m.get('name', '').split('/')[-1] for m in data.get('models', [])]
          print('model_count:', len(ids))
          missing = [
              model
              for model in ('gemini-3.5-flash-lite', 'gemini-3.6-flash')
              if model not in ids
          ]
          print('missing_routed_models:', missing or 'none')
          if missing:
              raise SystemExit(1)
          PY

      - name: Generate with the routed models
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          for model in gemini-3.5-flash-lite gemini-3.6-flash; do
            status=$(curl -sS --max-time 90 -o "reply-$model.json" -w "%{http_code}" \
              "https://generativelanguage.googleapis.com/v1beta/models/$model:generateContent" \
              -H "x-goog-api-key: $GEMINI_API_KEY" \
              -H "Content-Type: application/json" \
              -d '{"contents":[{"role":"user","parts":[{"text":"Reply with exactly: OK"}]}],"generationConfig":{"maxOutputTokens":512}}')
            MODEL="$model" STATUS="$status" python3 - <<'PY'
          import json, os
          model = os.environ['MODEL']
          print(f"model={model} http={os.environ['STATUS']}")
          data = json.load(open(f'reply-{model}.json'))
          if isinstance(data, dict) and data.get('error'):
              print('  error_status:', data['error'].get('status'))
              print('  error_message:', data['error'].get('message'))
              raise SystemExit(1)
          candidate = (data.get('candidates') or [{}])[0]
          text = ''.join(
              part.get('text', '')
              for part in candidate.get('content', {}).get('parts', [])
          ).strip()
          usage = data.get('usageMetadata') or {}
          print(
              '  finish:', candidate.get('finishReason'),
              'thoughts:', usage.get('thoughtsTokenCount', 0),
              'reply:', text[:80] or '(empty)',
          )
          if text != 'OK':
              raise SystemExit(1)
          PY
          done

      - name: Stream with the routed models
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          for model in gemini-3.5-flash-lite gemini-3.6-flash; do
            started=$(date +%s)
            status=$(curl -sS --max-time 150 -o "stream-$model.txt" -w "%{http_code}" \
              "https://generativelanguage.googleapis.com/v1beta/models/$model:streamGenerateContent?alt=sse" \
              -H "x-goog-api-key: $GEMINI_API_KEY" \
              -H "Content-Type: application/json" \
              -d '{"contents":[{"role":"user","parts":[{"text":"Write two sentences about pasta."}]}],"generationConfig":{"maxOutputTokens":2200}}')
            elapsed=$(( $(date +%s) - started ))
            if [ "$status" = "429" ]; then
              echo "model=$model http=429 rate_limited (warning only; fallback model)"
              continue
            fi
            MODEL="$model" STATUS="$status" ELAPSED="$elapsed" python3 - <<'PY'
          import json, os
          model = os.environ['MODEL']
          raw = open(f'stream-{model}.txt', encoding='utf-8', errors='replace').read()
          chunks = [line[5:].strip() for line in raw.splitlines() if line.startswith('data:')]
          text = ''
          error = None
          finish = None
          for chunk in chunks:
              try:
                  data = json.loads(chunk)
              except json.JSONDecodeError:
                  continue
              if data.get('error'):
                  error = data['error']
                  break
              candidate = (data.get('candidates') or [{}])[0]
              finish = candidate.get('finishReason') or finish
              for part in candidate.get('content', {}).get('parts', []):
                  text += part.get('text', '')
          print(
              f"model={model} http={os.environ['STATUS']} events={len(chunks)}",
              f"seconds={os.environ['ELAPSED']} finish={finish} text_len={len(text)}",
          )
          if error:
              print('  error_status:', error.get('status'))
              print('  error_message:', error.get('message'))
              raise SystemExit(1)
          print('  text:', text[:120] or '(empty)')
          if not text.strip():
              raise SystemExit(1)
          PY
          done

  openrouter:
    name: OpenRouter free call
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPENROUTER_MODEL: openrouter/free
    steps:
      - name: Check the key and generate
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "::error::OPENROUTER_API_KEY repository secret is not set"
            exit 1
          fi
          status=$(curl -sS --max-time 120 -o reply.json -w "%{http_code}" \
            "https://openrouter.ai/api/v1/chat/completions" \
            -H "Authorization: Bearer $OPENROUTER_API_KEY" \
            -H "Content-Type: application/json" \
            -H "HTTP-Referer: https://rezaxr14.github.io/WhatToCook_mobile_serverless/" \
            -H "X-Title: WhatToCook" \
            -d "{\"model\":\"$OPENROUTER_MODEL\",\"messages\":[{\"role\":\"user\",\"content\":\"Reply with exactly: OK\"}],\"max_tokens\":2048}")
          echo "generate_http=$status"
          python3 - <<'PY'
          import json, os
          data = json.load(open('reply.json'))
          if isinstance(data, dict) and data.get('error'):
              print('error_code:', data['error'].get('code'))
              print('error_message:', data['error'].get('message'))
              raise SystemExit(1)
          choice = (data.get('choices') or [{}])[0]
          text = (choice.get('message') or {}).get('content') or ''
          print('model:', os.environ['OPENROUTER_MODEL'])
          print('finish:', choice.get('finish_reason'))
          print('usage:', data.get('usage'))
          print('reply:', text.strip()[:120] or '(empty)')
          if not text.strip():
              print('message_keys:', sorted(((choice.get('message') or {}).keys())))
              print('reasoning:', str((choice.get('message') or {}).get('reasoning'))[:200])
          if not text.strip():
              raise SystemExit(1)
          PY
