name: OpenRouter JSON probe

on:
  push:
    branches:
      - fix/ai-dish-images
    paths:
      - .github/workflows/openrouter-json-probe.yml

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Probe free models for structured output
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request

          key = os.environ['OPENROUTER_API_KEY']
          prompt = (
              'You are a master creative chef. Based on these available pantry ingredients: '
              'Pasta, Tomato, Garlic, suggest 5 realistic, enticing, and distinct dishes that can be cooked. '
              'Return ONLY a JSON array with objects containing: name (str), short_description (str), '
              'cuisine (str), difficulty (Easy/Medium/Hard), prep_time (e.g. 25 mins), '
              'image_hint (e.g. pasta, chicken, salad, soup).'
          )
          cases = [
              ('openrouter/free', 4096, None),
              ('openrouter/free', 8192, None),
              ('google/gemma-4-31b-it:free', 2000, False),
              ('dots-studio/dots-3-note-preview:free', 4000, False),
              ('nvidia/nemotron-3.5-super-vl:free', 4000, False),
          ]
          for model, budget, reasoning in cases:
              body = {
                  'model': model,
                  'messages': [{'role': 'user', 'content': prompt}],
                  'temperature': 0.7,
                  'max_tokens': budget,
                  'response_format': {'type': 'json_object'},
              }
              if reasoning is not None:
                  body['reasoning'] = {'enabled': reasoning}
              request = urllib.request.Request(
                  'https://openrouter.ai/api/v1/chat/completions',
                  data=json.dumps(body).encode(),
                  headers={
                      'Authorization': f'Bearer {key}',
                      'Content-Type': 'application/json',
                      'HTTP-Referer': 'https://rezaxr14.github.io/WhatToCook_mobile_serverless/',
                      'X-Title': 'WhatToCook',
                  },
              )
              started = time.time()
              try:
                  with urllib.request.urlopen(request, timeout=240) as response:
                      data = json.load(response)
                  status = 200
              except Exception as error:
                  print(f'model={model} budget={budget} exception={error}')
                  continue
              seconds = round(time.time() - started)
              print(f'model={model} budget={budget} seconds={seconds}')
              if data.get('error'):
                  print('  error:', data['error'])
                  continue
              choice = (data.get('choices') or [{}])[0]
              text = (choice.get('message') or {}).get('content') or ''
              usage = data.get('usage') or {}
              print('  finish:', choice.get('finish_reason'), 'chars:', len(text), 'usage:', usage)
              try:
                  parsed = json.loads(text)
              except Exception as error:
                  print('  json_error:', error, 'head:', text[:160].replace('\n', ' '))
                  continue
              rows = parsed if isinstance(parsed, list) else None
              if rows is None:
                  print('  shape:', type(parsed).__name__, 'keys:', list(parsed)[:6])
                  continue
              required = {'name', 'short_description', 'cuisine', 'difficulty', 'prep_time', 'image_hint'}
              complete = sum(1 for row in rows if isinstance(row, dict) and required.issubset(row))
              print('  rows:', len(rows), 'complete:', complete)
          PY
