name: Supabase

on:
  pull_request:
    paths:
      - 'supabase/**'
      - 'packages/shared/src/ingredient-images.ts'
      - '.github/workflows/supabase.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - 'packages/shared/src/ingredient-images.ts'
      - '.github/workflows/supabase.yml'
  workflow_dispatch:

concurrency:
  group: supabase-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Local schema and pgTAP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: latest

      - name: Start local stack
        run: supabase start

      - name: Lint schema
        run: supabase db lint --local --schema public --level warning --fail-on error

      - name: Run pgTAP suite
        run: supabase test db

      - name: Stop local stack
        if: always()
        run: supabase stop --no-backup

  deploy:
    name: Push staging migrations and catalog images
    needs: verify
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: staging
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: latest

      - name: Check deploy secrets
        id: gate
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_ID" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Skipping staging deploy. Add SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_ID, and SUPABASE_DB_PASSWORD as repository or staging environment secrets."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Link project
        if: steps.gate.outputs.configured == 'true'
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"

      - name: Push migrations
        if: steps.gate.outputs.configured == 'true'
        # Newer Supabase CLI versions refuse `--password` unless the target is
        # explicit; name the project instead of relying on a local link.
        run: supabase db push --remote "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD" --yes

      - name: Deploy Edge Functions
        if: steps.gate.outputs.configured == 'true'
        # Deploy every function, not just the maintenance/Telegram ones: the AI
        # gateway used to be deployed by hand, so `main` and production drifted.
        # Use the default Docker bundler: `--use-api` ignores deno.json's import
        # map, so any function that reaches `packages/shared` fails to bundle.
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_ID" --yes

      - name: Upload catalog images (add-only)
        if: steps.gate.outputs.configured == 'true'
        run: |
          # Add-only: never remove an object. Installed apps may still reference
          # a superseded path, and a content-hashed name means changed bytes get
          # a new URL. Re-uploading the same bytes only refreshes metadata.
          upload() {
            local source="$1" object="$2"
            supabase storage cp "$source" "ss:///recipe-images/$object" \
              --project-ref "$SUPABASE_PROJECT_ID" \
              --cache-control "public, max-age=315360000, immutable" \
              --experimental --yes
          }

          list_names() {
            supabase storage ls "ss:///recipe-images/$1/" \
              --project-ref "$SUPABASE_PROJECT_ID" \
              --experimental --output-format json 2>/dev/null |
              jq -r '.paths[]?' || true
          }

          for dir in recipes dishes ingredients; do
            [ -d "supabase/seed-images/$dir" ] || continue
            existing="$(list_names "$dir")"
            for file in "supabase/seed-images/$dir"/*; do
              [ -f "$file" ] || continue
              name="$(basename "$file")"
              if printf '%s\n' "$existing" | grep -Fxq "$name"; then
                echo "keep $dir/$name"
                continue
              fi
              upload "$file" "$dir/$name"
            done
          done
