name: Supabase

on:
  pull_request:
    paths:
      - 'supabase/**'
      - 'packages/shared/src/ingredient-images.ts'
      - '.github/workflows/supabase.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - 'packages/shared/src/ingredient-images.ts'
      - '.github/workflows/supabase.yml'
  workflow_dispatch:

concurrency:
  group: supabase-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Local schema and pgTAP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local stack
        run: supabase start

      - name: Lint schema
        run: supabase db lint --local --schema public --level warning --fail-on error

      - name: Run pgTAP suite
        run: supabase test db

      - name: Stop local stack
        if: always()
        run: supabase stop --no-backup

  deploy:
    name: Push staging migrations and catalog images
    needs: verify
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: staging
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v7

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Check deploy secrets
        id: gate
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_ID" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Skipping staging deploy. Add SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_ID, and SUPABASE_DB_PASSWORD as repository or staging environment secrets."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Link project
        if: steps.gate.outputs.configured == 'true'
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"

      - name: Push migrations
        if: steps.gate.outputs.configured == 'true'
        run: supabase db push --password "$SUPABASE_DB_PASSWORD" --yes

      - name: Deploy maintenance functions
        if: steps.gate.outputs.configured == 'true'
        run: >-
          supabase functions deploy cache-ingredient-images
          --project-ref "$SUPABASE_PROJECT_ID" --use-api

      - name: Upload catalog images
        if: steps.gate.outputs.configured == 'true'
        run: |
          for file in supabase/seed-images/recipes/*.jpg; do
            name="$(basename "$file")"
            # storage cp does not upsert; remove first so redeploys are idempotent.
            supabase storage rm "ss:///recipe-images/recipes/$name" \
              --project-ref "$SUPABASE_PROJECT_ID" --experimental --yes >/dev/null 2>&1 || true
            supabase storage cp "$file" "ss:///recipe-images/recipes/$name" \
              --project-ref "$SUPABASE_PROJECT_ID" \
              --cache-control "public, max-age=31536000, immutable" \
              --experimental --yes
          done
