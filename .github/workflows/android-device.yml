name: Android device build

# Builds an installable, debug-signed release APK on every mobile change to main
# so device smoke tests no longer need a local Android SDK/Gradle toolchain.
# Every build refreshes a rolling `android-device-latest` GitHub Release, so the
# APK can be downloaded from a phone without signing in to Actions.
#
# Production/Play builds stay in `android-release.yml` and still require the
# release keystore secrets.

on:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'packages/shared/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/android-device.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-device-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build installable APK
    runs-on: ubuntu-latest
    env:
      APP_VARIANT: production
      APP_VERSION_CODE: ${{ github.run_number }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v4

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Expo prebuild
        run: pnpm --filter @whattocook/mobile exec expo prebuild --platform android --clean --no-install

      - name: Assemble release APK
        working-directory: apps/mobile/android
        run: >-
          ./gradlew :app:assembleRelease --no-daemon
          -Dorg.gradle.internal.http.socketTimeout=120000

      - uses: actions/upload-artifact@v5
        with:
          name: whattocook-device-${{ github.sha }}
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish rolling device release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="android-device-latest"
          asset="$RUNNER_TEMP/WhatToCook-android-device.apk"
          notes="$RUNNER_TEMP/device-release-notes.md"

          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk "$asset"

          cat > "$notes" <<EOF
          Debug-signed APK built from [\`${GITHUB_SHA:0:7}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}) by the [Android device build](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}).

          - Package: \`com.whattocook.app\`
          - Version code: \`${APP_VERSION_CODE}\`
          - Signed with the standard Android debug keystore. This is a device-testing build, not a Play Store build.
          - Install with \`adb install -r WhatToCook-android-device.apk\`, or open the downloaded file on the phone.
          EOF

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" \
              --title "WhatToCook Android device build (latest)" \
              --notes-file "$notes" \
              --prerelease
          else
            gh release create "$tag" \
              --target "$GITHUB_SHA" \
              --title "WhatToCook Android device build (latest)" \
              --notes-file "$notes" \
              --prerelease
          fi

          gh release upload "$tag" "$asset" --clobber
